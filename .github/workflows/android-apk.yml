name: Convert PWA to Android APK

# Builds a sideloadable Forma APK (Trusted Web Activity wrapping the live app).
# Run from the Actions tab → "Convert PWA to Android APK" → type your live HTTPS URL.
# The APK appears under that run's Artifacts as forma-android-apk.

on:
  workflow_dispatch:
    inputs:
      pwa_url:
        description: Live HTTPS URL of the deployed Forma app (no trailing slash)
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "android/**"
      - "public/manifest.webmanifest"
      - "scripts/patch-android-url.mjs"

permissions:
  contents: read

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google removed the legacy "tools" package from the SDK repo; this
          # action's default `packages` input still asks for it and fails the
          # whole step. We install everything we actually need explicitly in
          # the next step anyway, so just get platform-tools here.
          packages: "platform-tools"

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Patch live app URL into the Android project
        env:
          PWA_URL: ${{ github.event.inputs.pwa_url || vars.PWA_URL }}
        run: |
          if [ -z "$PWA_URL" ]; then
            echo "No PWA URL provided. Re-run via workflow_dispatch and paste your live HTTPS URL."
            exit 1
          fi
          node scripts/patch-android-url.mjs "$PWA_URL"

      - name: Assemble release APK (debug-signed for sideload)
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist-apk
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} dist-apk/forma.apk \;
          ls -la dist-apk
          keytool -printcert -jarfile dist-apk/forma.apk | sed -n 's/.*SHA256:\s*/Asset Links SHA-256: /p' || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: forma-android-apk
          path: dist-apk/forma.apk
          if-no-files-found: error
          retention-days: 30
